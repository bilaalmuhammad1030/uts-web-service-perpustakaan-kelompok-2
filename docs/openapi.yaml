                $ref: '#/components/schemas/KategoriResponse'
        401:
          description: 'Silakan login sebagai Admin.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: UNAUTHENTICATED
                  message: 'Silakan login sebagai Admin.'
                  details: {}
        409:
          description: 'Kategori masih digunakan buku, termasuk buku yang diarsipkan.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: BUSINESS_CONFLICT
                  message: 'Kategori masih digunakan buku, termasuk buku yang diarsipkan.'
                  details: {}
        422:
          description: 'Periksa kembali data yang dikirim.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: 'Periksa kembali data yang dikirim.'
                  details:
                    nama:
                      - 'Nama kategori sudah digunakan.'
        500:
          description: 'Terjadi gangguan pada server.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INTERNAL_ERROR
                  message: 'Terjadi gangguan pada server.'
                  details: {}
  '/kategori/{kategori}':
    parameters:
      -
        in: path
        name: kategori
