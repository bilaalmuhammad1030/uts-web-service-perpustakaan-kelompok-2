          in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: '20 catatan per halaman, terbaru terlebih dahulu.'
      responses:
        200:
          description: 'Permintaan berhasil.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiwayatPage'
        401:
