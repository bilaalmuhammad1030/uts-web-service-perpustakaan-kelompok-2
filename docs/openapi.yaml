openapi: 3.0.3
info:
  title: 'Web Service Ketersediaan Buku Perpustakaan — Kelompok 2'
  version: 1.1.0
  description: 'Kontrak v1.1.0 untuk API /api/v1. Program: Mochamad Bilal Muadzin (23215025); laporan/PPT: Nofia. Hanya informasi ketersediaan; peminjaman, pengembalian, denda dan reservasi di luar lingkup. Waktu respons ISO-8601 UTC, tampilan WIB.'
  license:
    name: MIT
    url: 'https://opensource.org/license/mit'
servers:
  -
    url: 'http://127.0.0.1:8000/api/v1'
    description: 'Pengembangan lokal'
tags:
  -
    name: Buku
    description: 'Koleksi perpustakaan.'
  -
    name: Kategori
    description: 'Pengelompokan koleksi.'
  -
    name: Stok
    description: 'Ketersediaan dan audit stok.'
  -
    name: Autentikasi
    description: 'Akses Admin.'
  -
    name: Metadata
    description: 'Informasi tambahan dari penyedia luar.'
security: []
paths:
  /auth/login:
    post:
      operationId: loginAdmin
      summary: 'Login Admin'
      tags:
        - Autentikasi
      description: 'Token Bearer berlaku 8 jam, disimpan sebagai SHA-256 di database. Satu token aktif per Admin; login ulang mengganti token sebelumnya. Maksimal 5 percobaan/menit per IP.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: adminperpustakaan@gmail.com
              password: isi-kata-sandi-lokal
      responses:
        200:
          description: 'Permintaan berhasil.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        401:
          description: 'Silakan login sebagai Admin.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: UNAUTHENTICATED
                  message: 'Silakan login sebagai Admin.'
                  details: {}
        422:
          description: 'Periksa kembali data yang dikirim.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: 'Periksa kembali data yang dikirim.'
                  details:
                    email:
                      - 'Email wajib diisi.'
        429:
          description: 'Terlalu banyak permintaan. Coba lagi sebentar.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: TOO_MANY_REQUESTS
                  message: 'Terlalu banyak permintaan. Coba lagi sebentar.'
                  details: {}
        500:
          description: 'Terjadi gangguan pada server.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INTERNAL_ERROR
                  message: 'Terjadi gangguan pada server.'
                  details: {}
  /auth/logout:
    post:
      operationId: logoutAdmin
      summary: 'Cabut token Admin'
      tags:
        - Autentikasi
      description: 'Cabut token Admin'
      security:
        -
          AdminBearer: []
      responses:
        204:
          description: 'Berhasil, tanpa body.'
        401:
          description: 'Silakan login sebagai Admin.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: UNAUTHENTICATED
                  message: 'Silakan login sebagai Admin.'
                  details: {}
        500:
          description: 'Terjadi gangguan pada server.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INTERNAL_ERROR
                  message: 'Terjadi gangguan pada server.'
                  details: {}
  /buku:
    get:
      operationId: daftarBuku
      summary: 'Daftar, cari, filter, urutkan dan halaman buku'
      tags:
        - Buku
      description: 'Daftar, cari, filter, urutkan dan halaman buku'
      security: []
      parameters:
        -
          in: query
          name: q
          schema:
            type: string
            maxLength: 200
          description: 'Cari judul atau penulis, tidak peka kapital pada database MySQL yang dipakai.'
        -
          in: query
          name: kategori_id
          schema:
            type: integer
            minimum: 1
          description: 'ID kategori yang ada.'
        -
          in: query
          name: tersedia
          schema:
            type: integer
            enum:
              - 0
              - 1
          description: '1: stok > 0; 0: stok kosong.'
        -
          in: query
          name: sort
          schema:
            type: string
            enum:
              - judul
              - penulis
              - jumlah_tersedia
              - stok_diperbarui_at
            default: judul
          description: 'Kolom pengurutan.'
        -
          in: query
          name: direction
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
          description: 'Arah urutan; ID menjadi urutan kedua.'
        -
          in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 6
          description: 'Jumlah data per halaman.'
        -
          in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 'Nomor halaman.'
      responses:
        200:
          description: 'Permintaan berhasil.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BukuPage'
              example:
                data:
                  -
                    id: 1
                    kode_buku: BK001
                    judul: 'Laskar Pelangi'
                    penulis: 'Andrea Hirata'
                    deskripsi: 'Kisah persahabatan dan semangat belajar.'
                    isbn: null
                    kategori:
                      id: 1
                      nama: Novel
                    lokasi_rak: A-01
                    jumlah_total: 8
                    jumlah_tersedia: 5
                    versi_stok: 1
                    stok_diperbarui_at: '2026-11-08T10:00:00.000000Z'
                    penerbit: 'Penerbit Kelompok 2'
                    tahun_terbit: 2020
                links:
                  first: 'http://127.0.0.1:8000/api/v1/buku?page=1'
                  last: 'http://127.0.0.1:8000/api/v1/buku?page=1'
                  prev: null
                  next: null
                meta:
                  current_page: 1
                  last_page: 1
                  per_page: 6
                  total: 1
        422:
          description: 'Periksa kembali data yang dikirim.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: 'Periksa kembali data yang dikirim.'
                  details:
                    jumlah_tersedia:
                      - 'Jumlah tersedia harus kurang dari atau sama dengan jumlah_total.'
        500:
          description: 'Terjadi gangguan pada server.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INTERNAL_ERROR
                  message: 'Terjadi gangguan pada server.'
                  details: {}
    post:
      operationId: buatBuku
      summary: 'Catat buku dan stok awal'
      tags:
        - Buku
      description: 'Kode buku unik termasuk buku arsip. Buku dan riwayat awal disimpan dalam satu transaksi.'
      security:
        -
          AdminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BukuCreate'
            example:
              kode_buku: DEMO-001
              kategori_id: 1
              judul: 'Belajar Web Service'
              penulis: 'Kelompok 2'
              lokasi_rak: C-01
              jumlah_total: 10
              jumlah_tersedia: 7
              penerbit: 'Penerbit Kelompok 2'
              tahun_terbit: 2020
      responses:
        201:
          description: 'Data berhasil dibuat.'
          headers:
            Location:
              description: 'URL detail data baru.'
              schema:
                type: string
                format: uri
              example: 'http://127.0.0.1:8000/api/v1/buku/13'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BukuResponse'
              example:
                data:
                  id: 13
                  kode_buku: BK001
                  judul: 'Laskar Pelangi'
                  penulis: 'Andrea Hirata'
                  deskripsi: 'Kisah persahabatan dan semangat belajar.'
                  isbn: null
                  kategori:
                    id: 1
                    nama: Novel
                  lokasi_rak: A-01
                  jumlah_total: 8
                  jumlah_tersedia: 5
                  versi_stok: 1
                  stok_diperbarui_at: '2026-11-08T10:00:00.000000Z'
                  penerbit: 'Penerbit Kelompok 2'
                  tahun_terbit: 2020
        401:
          description: 'Silakan login sebagai Admin.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: UNAUTHENTICATED
                  message: 'Silakan login sebagai Admin.'
                  details: {}
        409:
          description: 'Stok sudah diubah Admin lain. Muat ulang detail buku dan kirim versi_stok terbaru.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: BUSINESS_CONFLICT
                  message: 'Stok sudah diubah Admin lain. Muat ulang detail buku dan kirim versi_stok terbaru.'
                  details: {}
        422:
          description: 'Periksa kembali data yang dikirim.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: 'Periksa kembali data yang dikirim.'
                  details:
                    jumlah_tersedia:
                      - 'Jumlah tersedia harus kurang dari atau sama dengan jumlah_total.'
        500:
          description: 'Terjadi gangguan pada server.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INTERNAL_ERROR
                  message: 'Terjadi gangguan pada server.'
                  details: {}
  '/buku/{buku}':
    parameters:
      -
        in: path
        name: buku
        required: true
        description: 'ID data.'
        schema:
          type: integer
          minimum: 1
    get:
      operationId: detailBuku
      summary: 'Detail dan ketersediaan buku'
      tags:
        - Buku
      description: 'Detail dan ketersediaan buku'
      security: []
      responses:
        200:
          description: 'Permintaan berhasil.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BukuResponse'
              example:
                data:
                  id: 1
                  kode_buku: BK001
                  judul: 'Laskar Pelangi'
                  penulis: 'Andrea Hirata'
                  deskripsi: 'Kisah persahabatan dan semangat belajar.'
                  isbn: null
                  kategori:
                    id: 1
                    nama: Novel
                  lokasi_rak: A-01
                  jumlah_total: 8
                  jumlah_tersedia: 5
                  versi_stok: 1
                  stok_diperbarui_at: '2026-11-08T10:00:00.000000Z'
                  penerbit: 'Penerbit Kelompok 2'
                  tahun_terbit: 2020
        404:
          description: 'Data atau endpoint tidak ditemukan.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: NOT_FOUND
                  message: 'Data atau endpoint tidak ditemukan.'
                  details: {}
        500:
          description: 'Terjadi gangguan pada server.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INTERNAL_ERROR
                  message: 'Terjadi gangguan pada server.'
                  details: {}
    put:
      operationId: ubahBuku
      summary: 'Ubah data deskriptif buku'
      tags:
        - Buku
      description: 'Semua field wajib, termasuk penerbit dan tahun_terbit, harus dikirim. Jumlah dan versi stok dilarang; gunakan endpoint stok. Tahun 1901 sampai tahun berjalan (maksimal 2155).'
      security:
        -
          AdminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BukuUpdate'
            example:
              kode_buku: DEMO-001
              kategori_id: 1
              judul: 'Belajar Web Service'
              penulis: 'Kelompok 2'
              lokasi_rak: C-01
              penerbit: 'Penerbit Kelompok 2'
              tahun_terbit: 2020
      responses:
        200:
          description: 'Permintaan berhasil.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BukuResponse'
        401:
          description: 'Silakan login sebagai Admin.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: UNAUTHENTICATED
                  message: 'Silakan login sebagai Admin.'
                  details: {}
        404:
          description: 'Data atau endpoint tidak ditemukan.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: NOT_FOUND
                  message: 'Data atau endpoint tidak ditemukan.'
                  details: {}
        409:
          description: 'Stok sudah diubah Admin lain. Muat ulang detail buku dan kirim versi_stok terbaru.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: BUSINESS_CONFLICT
                  message: 'Stok sudah diubah Admin lain. Muat ulang detail buku dan kirim versi_stok terbaru.'
                  details: {}
        422:
          description: 'Periksa kembali data yang dikirim.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: 'Periksa kembali data yang dikirim.'
                  details:
                    jumlah_tersedia:
                      - 'Jumlah tersedia harus kurang dari atau sama dengan jumlah_total.'
        500:
          description: 'Terjadi gangguan pada server.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INTERNAL_ERROR
                  message: 'Terjadi gangguan pada server.'
                  details: {}
    delete:
      operationId: hapusBuku
      summary: 'Arsipkan buku dari katalog'
      tags:
        - Buku
      description: 'Soft delete. Riwayat dipertahankan dan kode buku tidak dapat dipakai ulang.'
      security:
        -
          AdminBearer: []
      responses:
        204:
          description: 'Berhasil, tanpa body.'
        401:
          description: 'Silakan login sebagai Admin.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: UNAUTHENTICATED
                  message: 'Silakan login sebagai Admin.'
                  details: {}
        404:
          description: 'Data atau endpoint tidak ditemukan.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: NOT_FOUND
                  message: 'Data atau endpoint tidak ditemukan.'
                  details: {}
        409:
          description: 'Stok sudah diubah Admin lain. Muat ulang detail buku dan kirim versi_stok terbaru.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: BUSINESS_CONFLICT
                  message: 'Stok sudah diubah Admin lain. Muat ulang detail buku dan kirim versi_stok terbaru.'
