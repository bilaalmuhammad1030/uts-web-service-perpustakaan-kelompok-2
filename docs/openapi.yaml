                  details: {}
  '/buku/{buku}/stok':
    parameters:
      -
        in: path
        name: buku
        required: true
        description: 'ID data.'
        schema:
          type: integer
          minimum: 1
    patch:
      operationId: perbaruiStok
      summary: 'Perbarui stok secara atomik'
      tags:
        - Stok
      description: 'DB::transaction dengan lockForUpdate, validasi versi, pembaruan buku dan pencatatan audit. Gagal audit membatalkan seluruh perubahan. Deadlock dicoba ulang maksimal 3 kali. Input tidak valid 422; versi lama 409. Kirim nilai absolut, bukan delta.'
      security:
        -
          AdminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StokUpdate'
            example:
              jumlah_total: 10
              jumlah_tersedia: 5
              versi_stok: 1
              alasan: 'Pengecekan rak'
      responses:
        200:
          description: 'Permintaan berhasil.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BukuResponse'
        401:
          description: 'Silakan login sebagai Admin.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: UNAUTHENTICATED
                  message: 'Silakan login sebagai Admin.'
                  details: {}
        404:
          description: 'Data atau endpoint tidak ditemukan.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: NOT_FOUND
                  message: 'Data atau endpoint tidak ditemukan.'
                  details: {}
        409:
          description: 'Stok sudah diubah Admin lain. Muat ulang detail buku dan kirim versi_stok terbaru.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: BUSINESS_CONFLICT
                  message: 'Stok sudah diubah Admin lain. Muat ulang detail buku dan kirim versi_stok terbaru.'
                  details: {}
        422:
          description: 'Periksa kembali data yang dikirim.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: 'Periksa kembali data yang dikirim.'
                  details:
                    jumlah_tersedia:
                      - 'Jumlah tersedia harus kurang dari atau sama dengan jumlah_total.'
        500:
          description: 'Terjadi gangguan pada server.'
          content:
            application/json:
              schema:
